name: Project verification

on:
  push:
    paths: ['backend/**', 'frontend/**', '.github/workflows/verify.yml']
  pull_request:
    paths: ['backend/**', 'frontend/**', '.github/workflows/verify.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # 独立服务仅用于随机测试库，版本与当前仓库实际 PostgreSQL 下限一致。
    # 服务容器映射方式：https://docs.github.com/en/actions/tutorials/use-containerized-services/create-postgresql-service-containers
    services:
      postgres:
        image: postgres:12.1
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: 'backend/**/pom.xml'
      - name: 使用项目 Maven 3.9.1
        run: |
          curl --fail --silent --show-error --location https://archive.apache.org/dist/maven/maven-3/3.9.1/binaries/apache-maven-3.9.1-bin.tar.gz | tar -xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/apache-maven-3.9.1/bin" >> "$GITHUB_PATH"
      - name: 构建与真实隔离数据库回归
        working-directory: backend
        run: >-
          mvn --batch-mode --no-transfer-progress
          -Dauth.test.pg12.jdbc-url=jdbc:postgresql://127.0.0.1:55432/postgres
          -Dauth.test.pg12.username=postgres -Dauth.test.pg12.password=postgres
          -Dcore.test.pg12.jdbc-url=jdbc:postgresql://127.0.0.1:55432/postgres
          -Dcore.test.pg12.username=postgres -Dcore.test.pg12.password=postgres
          -Diot.test.pg12.jdbc-url=jdbc:postgresql://127.0.0.1:55432/postgres
          -Diot.test.pg12.username=postgres -Diot.test.pg12.password=postgres
          package
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run test:unit -- --run
      - run: npm run build
