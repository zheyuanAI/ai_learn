server:
  port: 10003
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: platform-core
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${POSTGRES_HOST:127.0.0.1}:${POSTGRES_PORT:5433}/${POSTGRES_DB:ai_learn}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 3000ms
  flyway:
    enabled: true
    table: core_flyway_schema_history
    locations: classpath:db/migration/core
    baseline-on-migrate: true
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
    serialization:
      write-dates-as-timestamps: false

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

management:
  endpoints:
    web:
      exposure:
        include: health,info

# S7 跨服务 Facts 默认不启用；部署时由密钥管理系统同时注入 Core/IoT 两端的 HMAC 密钥。
core:
  facts:
    iot:
      enabled: ${CORE_FACTS_IOT_ENABLED:false}
      base-url: ${CORE_FACTS_IOT_BASE_URL:http://127.0.0.1:10004}
      hmac-secret: ${CORE_FACTS_IOT_HMAC_SECRET:}

platform:
  default-time-zone: ${PLATFORM_DEFAULT_TIME_ZONE:Asia/Shanghai}
  ai:
    # AI 默认关闭；只有部署环境显式启用并注入本机 Open WebUI API Key 时才可用。
    enabled: ${WMS_AI_ENABLED:false}
    # 当前默认由 Open WebUI 编排；deepseek 直连仅作为显式配置的故障诊断回退。
    provider: ${WMS_AI_PROVIDER:open-webui}
    base-url: ${WMS_AI_BASE_URL:https://api.deepseek.com}
    model: ${WMS_AI_MODEL:deepseek-v4-flash}
    api-key: ${WMS_AI_API_KEY:}
    connect-timeout: ${WMS_AI_CONNECT_TIMEOUT:5s}
    stream-timeout: ${WMS_AI_STREAM_TIMEOUT:60s}
    tool-timeout: ${WMS_AI_TOOL_TIMEOUT:10s}
    max-tool-rounds: ${WMS_AI_MAX_TOOL_ROUNDS:4}
    max-tool-calls: ${WMS_AI_MAX_TOOL_CALLS:8}
    # 配置只能在代码已注册的只读工具中选择启用子集，未知工具会使应用启动失败。
    enabled-tools: ${WMS_AI_ENABLED_TOOLS:queryTrace,queryOperationAudit,querySalesOrderStatus,queryPurchaseOrderStatus,queryInventoryByProductAndWarehouse,queryWorkOrderProgress,queryQualityStatistics,queryDeviceAlarm,queryLowStock,generateDailyOperationReport}
    open-webui-base-url: ${WMS_OPENWEBUI_BASE_URL:http://127.0.0.1:3000}
    open-webui-api-key: ${WMS_OPENWEBUI_API_KEY:}
    open-webui-model: ${WMS_OPENWEBUI_MODEL:wms-assistant}
    # OpenAPI Tool Server 在 Open WebUI 中的连接 ID；只允许指向管理员预先注册的 WMS 工具集合。
    open-webui-tool-server-id: ${WMS_OPENWEBUI_TOOL_SERVER_ID:server:wms}
    # Open WebUI 调用 /internal/ai/tools/** 时使用的独立服务间密钥，不得复用用户 JWT。
    tool-service-secret: ${WMS_AI_TOOL_SERVICE_SECRET:}
    invocation-context-ttl: ${WMS_AI_INVOCATION_CONTEXT_TTL:10m}
