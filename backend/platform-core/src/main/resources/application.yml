server:
  port: 10003
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: platform-core
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${POSTGRES_HOST:127.0.0.1}:${POSTGRES_PORT:5433}/${POSTGRES_DB:ai_learn}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 3000ms
  flyway:
    enabled: true
    table: core_flyway_schema_history
    locations: classpath:db/migration/core
    baseline-on-migrate: true
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
    serialization:
      write-dates-as-timestamps: false

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

management:
  endpoints:
    web:
      exposure:
        include: health,info

# S7 跨服务 Facts 默认不启用；部署时由密钥管理系统同时注入 Core/IoT 两端的 HMAC 密钥。
core:
  facts:
    iot:
      enabled: ${CORE_FACTS_IOT_ENABLED:false}
      base-url: ${CORE_FACTS_IOT_BASE_URL:http://127.0.0.1:10004}
      hmac-secret: ${CORE_FACTS_IOT_HMAC_SECRET:}

platform:
  default-time-zone: ${PLATFORM_DEFAULT_TIME_ZONE:Asia/Shanghai}
