server:
  port: 10004
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: platform-iot
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${POSTGRES_HOST:127.0.0.1}:${POSTGRES_PORT:5433}/${POSTGRES_DB:ai_learn}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 3000ms
  flyway:
    enabled: true
    table: iot_flyway_schema_history
    locations: classpath:db/migration/iot
    baseline-on-migrate: true
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
    serialization:
      write-dates-as-timestamps: false

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

management:
  endpoints:
    web:
      exposure:
        include: health,info

# 真实 MQTT 消费默认关闭。启用时必须显式提供 Broker 地址和只读订阅账号；连接失败由监听器重试，
# 不会因为未配置 Broker 阻断 IoT HTTP 服务启动。发布设备凭证由 Mosquitto 外部 password_file 校验。
iot:
  internal:
    # Core S7 只读 Facts 的服务间 HMAC 密钥；留空时内部接口拒绝所有调用。
    s7-hmac-secret: ${IOT_INTERNAL_S7_HMAC_SECRET:}
  mqtt:
    enabled: ${IOT_MQTT_ENABLED:false}
    server-uri: ${IOT_MQTT_SERVER_URI:}
    topic-filter: ${IOT_MQTT_TOPIC_FILTER:devices/+/telemetry}
    client-id: ${IOT_MQTT_CLIENT_ID:platform-iot-telemetry-consumer}
    username: ${IOT_MQTT_USERNAME:}
    password: ${IOT_MQTT_PASSWORD:}
    qos: ${IOT_MQTT_QOS:1}
    connection-timeout-seconds: ${IOT_MQTT_CONNECTION_TIMEOUT_SECONDS:10}
    keep-alive-seconds: ${IOT_MQTT_KEEP_ALIVE_SECONDS:30}
    reconnect-delay-seconds: ${IOT_MQTT_RECONNECT_DELAY_SECONDS:5}
    clean-session: ${IOT_MQTT_CLEAN_SESSION:false}
    persistence-directory: ${IOT_MQTT_PERSISTENCE_DIRECTORY:}
