services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ai_learn
      POSTGRES_USER: ai_learn
      POSTGRES_PASSWORD: ai_learn
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "127.0.0.1:6379:6379"

  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "127.0.0.1:1883:1883"
    volumes:
      - ./docker/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

volumes:
  postgres_data:
