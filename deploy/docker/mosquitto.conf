# Docker 容器内监听所有网卡，宿主机端口由 Compose 限定为 127.0.0.1。
# 设备 MQTT 用户名必须使用 credential_reference（例如 cred_<uuid>），发布主题为
# devices/<credential_reference>/telemetry；这与平台创建凭证时返回的业务标识一致。
#
# 密码和 ACL 文件必须由部署环境注入，仓库不保存真实密码。注入后取消下面两行注释：
# password_file /mosquitto/config/passwordfile
# acl_file /mosquitto/config/aclfile
#
# aclfile 至少应包含：
#   pattern write devices/%u/telemetry
#   user <iot-readonly-account>
#   topic read devices/#
# 只读订阅账号不得作为设备 credential_reference；应用侧也会拒绝其主题凭证。
listener 1883 0.0.0.0
allow_anonymous false
persistence false
log_dest stdout
connection_messages true
log_type all
