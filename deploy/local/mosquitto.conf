# 自研项目本地 MQTT Broker：仅监听本机，默认拒绝匿名连接。
# 设备 MQTT 用户名必须使用 credential_reference（例如 cred_<uuid>），发布主题为
# devices/<credential_reference>/telemetry；IoT 服务订阅端使用独立只读账号。
#
# password_file 与 acl_file 由运行环境注入，仓库不保存真实密码。注入文件后按本机路径取消下面两行注释：
# password_file <外部注入的 Mosquitto password_file 绝对路径>
# acl_file <外部注入的 Mosquitto acl_file 绝对路径>
# ACL 至少应限制设备发布为 pattern write devices/%u/telemetry，并为 IoT 订阅账号只授予 topic read devices/#。
listener 1883 127.0.0.1
allow_anonymous false
persistence false
log_dest stdout
connection_messages true
log_type all
