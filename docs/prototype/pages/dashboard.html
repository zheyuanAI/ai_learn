<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#071019" />
  <link rel="icon" href="data:," />
  <title>首页综合看板 - AI Learn Prototype</title>
  <link rel="stylesheet" href="../assets/styles.css" />
</head>
<body data-page="dashboard" class="console-page">
  <div class="shell">
    <aside class="rail"></aside>

    <main class="workspace console-workspace">
      <header class="console-topbar">
        <div class="console-title-block">
          <div class="console-title-meta">
            <span class="console-module-code">DASHBOARD / CROSS-DOMAIN FACTS</span>
            <span class="console-live-mark"><i aria-hidden="true"></i> 只读聚合</span>
          </div>
          <h1>首页综合看板</h1>
          <p>黄金业务闭环 7 大事实域（库存、履约、制造、质量、设备、告警、追溯）只读聚合快照，30秒定时刷新，严禁创建第二套事实。</p>
        </div>

        <div style="display:flex;align-items:center;gap:12px;">
          <button type="button" class="console-action-btn primary" onclick="refreshDashboardNow()" style="padding:8px 14px;min-height:0;display:flex;flex-direction:row;align-items:center;gap:6px;" tabindex="0" role="button">
            <span>🔄 立即刷新</span>
            <span id="dashRefreshTimer" style="font-size:10px;color:var(--c-cyan);">30s</span>
          </button>
        </div>
      </header>

      <section class="console-review-bar" aria-label="看板时间范围与数据同步状态">
        <div>
          <span class="console-section-index">统计时间范围</span>
          <strong id="dashTimeRangeLabel">今日 (2026-08-26 00:00 - 23:59)</strong>
        </div>
        <div class="console-scenario-tabs" role="group" aria-label="时间范围切换">
          <button type="button" class="is-active" data-range="today" aria-pressed="true" tabindex="0" role="button">今日</button>
          <button type="button" data-range="week" aria-pressed="false" tabindex="0" role="button">近 7 天</button>
          <button type="button" data-range="month" aria-pressed="false" tabindex="0" role="button">近 30 天</button>
        </div>
        <div style="display:grid;gap:6px;justify-items:end;">
          <div style="display:flex;align-items:center;gap:8px;">
            <label for="dashSyncStatusSelect" class="console-section-index" style="font-size:10px;cursor:pointer;">同步状态控制</label>
            <select id="dashSyncStatusSelect" class="console-select" style="min-height:30px;height:30px;padding:2px 8px;font-size:11px;width:auto;" aria-label="数据同步状态">
              <option value="healthy" selected>数据正常 (Healthy)</option>
              <option value="delayed">数据更新延迟 (Delayed)</option>
              <option value="degraded">数据源暂不可用 (Degraded)</option>
            </select>
          </div>
          <p style="margin:0;">
            <strong>源领域同步:</strong> <span id="dashLastSync">2026-08-26 16:30:15 (实时)</span>
            <span id="dashSyncBadge" class="console-badge green" style="margin-left:4px;">● 数据正常 (Healthy)</span>
          </p>
        </div>
      </section>

      <div id="dashDegradedBanner" role="alert" aria-live="assertive" style="display:none;"></div>

      <section id="dashboardGrid" class="console-layout-full" aria-live="polite"></section>

      <footer class="console-disclaimer">
        <span>PROTOTYPE / NOT IMPLEMENTED</span>
        <p>页面字段、状态、权限和接口为一期目标设计；真实能力以实际代码、配置和自动化验证为准。</p>
      </footer>
    </main>
  </div>

  <div id="dashToast" class="console-toast" role="status" aria-live="polite"></div>

  <script src="../assets/app.js"></script>
  <script src="../assets/dashboard.js"></script>
</body>
</html>
