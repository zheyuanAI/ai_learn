schema: ai-learn-platform

context: |
  项目名称：制造与仓储协同、设备数字孪生与 AI 助手平台
  技术栈：Vue 3 + Vite + TypeScript；Spring Boot 多模块；PostgreSQL；Redis；RabbitMQ；Mosquitto；MinIO
  包管理器：前端按 npm 使用；锁文件未在仓库中确认
  Node 版本要求：未在仓库中确认
  部署基础路径：未在仓库中确认
  前端构建输出目录：未在仓库中确认（frontend/vite.config.ts 未显式配置 build.outDir）
  当前前端入口：frontend/src/main.ts
  当前前端主路由：/、/erp-wms、/mes、/iot、/gis、/ai
  当前事实源：specs/00-project/*.md、specs/*/{overview,domain,api,acceptance}.md、prototype/README.md、prototype/pages/*.html
  常用命令：
  - cd frontend && npm i
  - cd frontend && npm run dev
  - cd frontend && npm run build
  - cd frontend && npm run preview
  - cd deploy && docker compose up -d
  - cd backend && mvn package（未在仓库中以脚本形式确认）
  关键约束：
  - 用户是主开发，核心业务实现默认不由 Codex 直接接管
  - tenant_id 必须来自登录上下文，所有查询默认按租户过滤
  - 登录、JWT、租户上下文、权限菜单、库存冻结/释放/扣减/回补、采购入库、销售出库、工单执行、幂等、租户隔离、库存一致性、AI 工具审计属于高风险范围
  - AI 工具默认只读，必须保留审计痕迹
  - 变更状态机、错误码、接口字段、权限点或验收条件时，必须同步更新对应 spec
  - 页面字段、状态或按钮变化时，必须同步检查原型页和前端页面
  - 文档和说明默认使用中文
  - 修改 OpenSpec 流程时，以 AGENTS.md 与 openspec/README.md 为协作事实源

rules:
  proposal: |
    - 写清本次变更的业务目标、非目标、影响范围和高风险边界。
    - 若涉及核心业务实现，明确用户是否已授权由 AI 直接实现。
    - 若需要同步修改现有 specs、prototype 或 docs，要在 proposal 中写明。
  spec: |
    - 使用 requirement + scenario 描述本次变更的行为要求。
    - 只写本次变更影响的行为，不重写整个系统说明。
    - 若变更会影响现有领域规格，明确要同步回写哪个目录下的 domain/api/acceptance。
  design: |
    - 明确涉及文件、模块、状态流、接口流、UI 交互流。
    - 明确允许修改范围与禁止修改范围，避免 worker 发散式重构。
    - 涉及租户、权限、库存一致性、状态机、AI 审计时，写清验证点。
  tasks: |
    - 任务必须可由 Antigravity 顺序执行。
    - 每个任务尽量落到具体文件或具体模块。
    - 任务中必须包含验证动作。
    - 任务中必须显式包含现有 spec/prototype/docs 回写步骤与执行器自检步骤。
  worker-brief: |
    - 明确 worker 只负责实现，不负责重构整体架构或扩写需求。
    - 要求 worker 完成后更新 tasks.md 勾选状态，并汇报测试与风险。
    - 明确禁止范围外改动，遇到歧义或阻塞时必须停止。
  self-review: |
    - 该文档只记录 Antigravity 的实现后自检，不得写成最终审核结论。
    - 必须覆盖修改范围、行为一致性、已完成验证、现有 spec 回写情况和剩余风险。
  review: |
    - 审核优先关注行为回归、边界条件、设计一致性、测试缺口和未回写的事实文档。
    - 审核前应先参考 self-review.md，但必须保留 Codex 的独立结论。
  retrospective: |
    - 当 Antigravity 自检 2 次后仍未通过，或 Codex 退回导致明显返工时，建议补充 retrospective.md。
